name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install -e .

      - name: Run unit and integration test suite
        run: pytest -v

      - name: Run alignment & manifold evaluation CLI
        run: python scripts/evaluate_alignment.py

      - name: Run multimodal PDDL benchmark suite
        run: python scripts/run_multimodal_planner.py --benchmark
