[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-semantic-planner"
version = "1.0.0"
description = "Cross-Modal Skip-Gram Word Embeddings, Contrastive MobileNetV3 Visual Projection, and Neuro-Symbolic Multimodal PDDL Planning."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Oscar Moreno Veliz"}
]
dependencies = [
    "numpy>=1.24.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "scikit-learn>=1.2.0",
    "networkx>=3.0",
    "matplotlib>=3.7.0",
    "tqdm>=4.65.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
